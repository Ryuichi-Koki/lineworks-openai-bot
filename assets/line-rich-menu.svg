<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <rect width="2500" height="1686" fill="#EAF6F2"/>

  <!-- タイル背景（上部136pxは注意表示帯。タップ領域は割り当てない） -->
  <g>
    <rect x="0" y="136" width="833" height="775" fill="#0B5E63"/>
    <rect x="833" y="136" width="833" height="775" fill="#F6F1E4"/>
    <rect x="1666" y="136" width="834" height="775" fill="#EAF6F2"/>
    <rect x="0" y="911" width="833" height="775" fill="#EAF6F2"/>
    <rect x="833" y="911" width="833" height="775" fill="#FFFFFF"/>
    <rect x="1666" y="911" width="834" height="775" fill="#F6F1E4"/>
  </g>

  <g font-family="'Zen Kaku Gothic New','Yu Gothic','Hiragino Sans','Meiryo',sans-serif" text-anchor="middle">

    <!-- 1: 質問する -->
    <circle cx="416" cy="336" r="76" fill="#FFFFFF" opacity="0.12"/>
    <path d="M360 302h112a15 15 0 0 1 15 15v52a15 15 0 0 1-15 15h-60l-37 32v-32h-15a15 15 0 0 1-15-15v-52a15 15 0 0 1 15-15z" fill="none" stroke="#EAF6F2" stroke-width="15" stroke-linejoin="round"/>
    <path d="M399 327a17 17 0 1 1 19 26v9" fill="none" stroke="#EAF6F2" stroke-width="13" stroke-linecap="round"/>
    <circle cx="418" cy="384" r="7" fill="#EAF6F2"/>
    <text x="416" y="511" fill="#FFFFFF" font-size="72" font-weight="900">質問する</text>
    <text x="416" y="586" fill="#7FCFC2" font-size="40">AIが24時間すぐ回答</text>
    <rect x="156" y="681" width="520" height="92" rx="46" fill="#EAF6F2"/>
    <text x="416" y="742" fill="#0B5E63" font-size="42" font-weight="900">質問のしかた</text>

    <!-- 2: 料金・相談料 -->
    <circle cx="1249" cy="336" r="76" fill="#E1694C" opacity="0.16"/>
    <path d="M1204 289l45 51 45-51M1249 340v51M1213 356h72M1213 379h72" fill="none" stroke="#B4472F" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1249" y="511" fill="#173035" font-size="72" font-weight="900">料金・相談料</text>
    <text x="1249" y="586" fill="#6E8586" font-size="40">AIは無料・相談は都度</text>
    <rect x="989" y="681" width="520" height="92" rx="46" fill="#E1694C"/>
    <text x="1249" y="742" fill="#FFFFFF" font-size="42" font-weight="900">料金を見る</text>

    <!-- 3: 税理士に相談 -->
    <circle cx="2083" cy="336" r="76" fill="#2E9C9A" opacity="0.18"/>
    <circle cx="2083" cy="314" r="25" fill="none" stroke="#0B5E63" stroke-width="15"/>
    <path d="M2037 390a46 46 0 0 1 92 0" fill="none" stroke="#0B5E63" stroke-width="15" stroke-linecap="round"/>
    <text x="2083" y="511" fill="#0B5E63" font-size="72" font-weight="900">税理士に相談</text>
    <text x="2083" y="586" fill="#3F5A5C" font-size="40">有資格税理士が直接回答</text>
    <rect x="1823" y="681" width="520" height="92" rx="46" fill="#2E9C9A"/>
    <text x="2083" y="742" fill="#FFFFFF" font-size="42" font-weight="900">相談を始める</text>

    <!-- 4: マイページ -->
    <circle cx="416" cy="1111" r="76" fill="#2E9C9A" opacity="0.16"/>
    <path d="M371 1067h90v88h-90z" fill="none" stroke="#0B5E63" stroke-width="15" stroke-linejoin="round"/>
    <path d="M392 1094h48M392 1119h48M392 1140h28" stroke="#0B5E63" stroke-width="12" stroke-linecap="round"/>
    <text x="416" y="1286" fill="#173035" font-size="72" font-weight="900">マイページ</text>
    <text x="416" y="1361" fill="#6E8586" font-size="40">今月の残り回数</text>
    <rect x="156" y="1456" width="520" height="92" rx="46" fill="#0B5E63"/>
    <text x="416" y="1517" fill="#FFFFFF" font-size="42" font-weight="900">利用状況を見る</text>

    <!-- 5: お支払い・手続き -->
    <circle cx="1249" cy="1111" r="76" fill="#2E9C9A" opacity="0.16"/>
    <path d="M1199 1075h100v72h-100z" fill="none" stroke="#0B5E63" stroke-width="15" stroke-linejoin="round"/>
    <path d="M1199 1099h100" stroke="#0B5E63" stroke-width="15"/>
    <path d="M1220 1127h30" stroke="#0B5E63" stroke-width="12" stroke-linecap="round"/>
    <text x="1249" y="1286" fill="#173035" font-size="72" font-weight="900">お支払い</text>
    <text x="1249" y="1361" fill="#6E8586" font-size="38">お支払い方法・領収書</text>
    <rect x="989" y="1456" width="520" height="92" rx="46" fill="#2E9C9A"/>
    <text x="1249" y="1517" fill="#FFFFFF" font-size="42" font-weight="900">手続きを開く</text>

    <!-- 6: 規約・ヘルプ -->
    <circle cx="2083" cy="1111" r="76" fill="#3F5A5C" opacity="0.14"/>
    <path d="M2046 1064h56l21 21v70h-77z" fill="none" stroke="#3F5A5C" stroke-width="15" stroke-linejoin="round"/>
    <path d="M2063 1097h38M2063 1121h38" stroke="#3F5A5C" stroke-width="12" stroke-linecap="round"/>
    <text x="2083" y="1286" fill="#173035" font-size="72" font-weight="900">規約・ヘルプ</text>
    <text x="2083" y="1361" fill="#6E8586" font-size="40">利用規約・特商法</text>
    <rect x="1823" y="1456" width="520" height="92" rx="46" fill="#3F5A5C"/>
    <text x="2083" y="1517" fill="#FFFFFF" font-size="42" font-weight="900">規約を読む</text>
  </g>

  <!-- 注意表示帯 -->
  <g font-family="'Zen Kaku Gothic New','Yu Gothic','Hiragino Sans','Meiryo',sans-serif">
    <rect x="0" y="0" width="2500" height="136" fill="#0B5E63"/>
    <rect x="0" y="0" width="14" height="136" fill="#E1694C"/>
    <text x="60" y="88" fill="#7FCFC2" font-size="40" font-weight="700" letter-spacing="8">SUGU-ZEI</text>
    <text x="1290" y="88" fill="#FFFFFF" font-size="48" font-weight="700" text-anchor="middle">⚠ 個人情報（氏名・住所・電話番号・マイナンバー等）は送信しないでください</text>
  </g>

  <!-- タイル区切り -->
  <g stroke="#FFFFFF" stroke-width="5" opacity="0.75">
    <line x1="833" y1="136" x2="833" y2="1686"/>
    <line x1="1666" y1="136" x2="1666" y2="1686"/>
    <line x1="0" y1="911" x2="2500" y2="911"/>
  </g>
</svg>
